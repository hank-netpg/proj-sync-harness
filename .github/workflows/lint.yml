name: lint

# 워크플로·manifest·테스트 검사. main push / PR 시 실행.
#   - actionlint: .github/workflows/*.yml 문법·표현식·shellcheck
#   - manifest: marketplace.json / plugin.json 형식·source 경로 (release.yml 과 동일 기준)
#   - tests: tests/test_*.sh 전수 실행
#   - commit-title: PR 제목 = 커밋 제목(스쿼시 머지) 규약 검사
#
# tests 잡은 2026-08-28 에 추가했다. 그전까지 tests/ 는 **CI 에서 한 번도 돌지 않았고**
#   (워크플로 어디에도 참조가 없었다), 회귀 가드가 있어도 손으로 돌린 사람만 봤다.
#   issue #38(따옴표 없는 heredoc) 처럼 「머신 구성에 따라 있다 없다 하는」 결함은
#   그 사람의 PC 에서 재현되지 않으면 영영 안 걸린다.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "**/marketplace.json"
      - "**/plugin.json"
      - "build.sh"
      - "tests/**"
      - "plugin/ax/scripts/**"
      - "src/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifests (jq)
        run: |
          set -euo pipefail
          jq -e '.name and .plugins and (.plugins|length>0) and (.plugins[0].source)' \
            .claude-plugin/marketplace.json >/dev/null \
            || { echo "::error::루트 marketplace.json 형식 오류"; exit 1; }
          jq -e '.name' plugin/.claude-plugin/marketplace.json >/dev/null \
            || { echo "::error::plugin/marketplace.json 형식 오류"; exit 1; }
          jq -e '.name and .version' plugin/ax/.claude-plugin/plugin.json >/dev/null \
            || { echo "::error::plugin.json 형식 오류(name·version 필요)"; exit 1; }
          test -d "plugin/ax/scripts" || { echo "::error::source 경로(plugin/ax) 누락"; exit 1; }
          # 버전 정합 — 형식만 보면 두 값이 갈려도 통과한다. 실제로 v1.17.0 에서
          #   plugin.json 만 올라가고 마켓 인덱스는 1.16.0 에 머물러 릴리즈 후에야 발견됐다.
          #   인덱스는 `claude plugin marketplace update` 가 읽는 값이라, 갈리면 팀원에게 닿는
          #   버전 표기가 틀어진다.
          PV="$(jq -r '.version' plugin/ax/.claude-plugin/plugin.json)"
          MV="$(jq -r '.plugins[0].version // empty' .claude-plugin/marketplace.json)"
          [ -n "$MV" ] || { echo "::error::루트 marketplace.json 에 plugins[0].version 이 없습니다"; exit 1; }
          [ "$PV" = "$MV" ] || {
            echo "::error::버전 불일치 — plugin.json=$PV, 루트 marketplace.json=$MV (둘을 같이 올리세요)"; exit 1; }
          # dist/ARCHITECTURE.md 버전 라벨 — README 릴리즈 절차 2단계는 **수동**이라 빠지기 쉽다.
          #   실제로 v1.18.0 릴리즈에서 이 파일이 1.17.0 인 채로 proj-sync-dist.zip 에 실려 나갔다.
          #   #27(마켓 인덱스가 1.16.0 에 머문 건)과 같은 형태 — 수동 단계에 게이트가 없으면 반복된다.
          #   이 파일은 비개발자 팀원이 받는 배포 묶음의 안내서라, 버전이 틀리면 받는 사람이 먼저 본다.
          DH="$(sed -n '1s/.*(v\([0-9][0-9.]*\)).*/\1/p' dist/ARCHITECTURE.md)"
          [ -n "$DH" ] || { echo "::error::dist/ARCHITECTURE.md 1행에서 버전을 못 읽음 (형식: '# … (vX.Y.Z)')"; exit 1; }
          [ "$DH" = "$PV" ] || {
            echo "::error::dist/ARCHITECTURE.md 헤더 버전 불일치 — plugin.json=$PV, 헤더=$DH"; exit 1; }
          # subgraph 라벨은 여러 곳에 있을 수 있다. sort -u 로 모으면 **전부 일치할 때만**
          # 결과가 한 줄이 되므로, 값 하나와 비교하는 것으로 전건 검사가 된다(루프 불요).
          DSU="$(grep -o 'ax 플러그인 (v[0-9][0-9.]*)' dist/ARCHITECTURE.md \
                 | grep -o '[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*' | sort -u | tr '\n' ' ' | sed 's/ *$//')"
          [ -n "$DSU" ] || { echo "::error::dist/ARCHITECTURE.md 에서 'ax 플러그인 (vX.Y.Z)' 라벨을 못 찾음"; exit 1; }
          [ "$DSU" = "$PV" ] || {
            echo "::error::dist/ARCHITECTURE.md subgraph 라벨 불일치 — plugin.json=$PV, 라벨=$DSU"; exit 1; }
          echo "✓ dist/ARCHITECTURE.md 버전 라벨 일치 (v$PV)"
          echo "✓ manifest 검증 통과 (v$PV)"

  # 이 저장소는 **스쿼시 머지**라 PR 제목이 그대로 커밋 제목이 된다. 그래서 규약의 실제
  # 게이트는 로컬 훅이 아니라 여기다 — 훅을 켜지 않은 사람도 여기서 걸린다.
  #   GitHub 이 뒤에 ` (#123)` 을 붙이므로 PR 제목 상한은 64칸이다(72 - " (#123)").
  commit-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PR title (Conventional Commits + 72칸)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 제목은 env 로 받는다 — 표현식을 run 안에 직접 보간하면
          # 제목에 든 따옴표·백틱이 셸에서 실행된다(스크립트 인젝션).
          set -uo pipefail
          bash plugin/ax/scripts/lint_commit_msg.sh --title "$PR_TITLE"

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        run: |
          # set -e 를 켜지 않는다 — 한 테스트가 실패해도 나머지를 끝까지 돌려
          # 실패 목록 전체를 한 번에 본다(하나씩 고쳐 다시 미는 왕복을 없앤다).
          set -uo pipefail
          found=0; failed=""
          for t in tests/test_*.sh; do
            # 동기화 도구가 만드는 "이름 2.sh" 사본은 건너뛴다(.gitignore:22 와 같은 기준).
            #   CI 체크아웃에는 없지만, 같은 루프를 로컬에서도 쓸 수 있게 맞춰 둔다.
            case "$t" in *" "[2-9]".sh") continue ;; esac
            [ -f "$t" ] || continue
            found=$((found+1))
            echo "::group::$t"
            if bash "$t"; then echo "✓ $t"; else echo "::error file=$t::$t 실패"; failed="$failed $t"; fi
            echo "::endgroup::"
          done
          # 글롭이 아무것도 못 잡으면 "전부 통과"로 보인다 — 0건은 실패로 친다.
          [ "$found" -gt 0 ] || { echo "::error::tests/test_*.sh 를 하나도 찾지 못했습니다"; exit 1; }
          if [ -n "$failed" ]; then echo "실패:$failed"; exit 1; fi
          echo "✓ 테스트 $found 파일 전부 통과"
