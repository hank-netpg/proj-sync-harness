# 사업 전제 레지스터 (SSOT) — 운영시점.
# revision(history·WBS·요구사항추적표·회의록)을 증류해 사업이 딛고 선 load-bearing 전제를 모은다.
# 편집 후 `/ax:premise`(또는 bash premise_build.sh) 로 최상위 PREMISE.md(리뷰·신선도) 재생성.
# 파생물(PREMISE.md)은 손대지 말고 이 yml 을 고쳐 재빌드. 절차는 manage-premise 스킬.
#
# 필드:
#   유형    : 데이터범위|마일스톤|인력|산출물|요구충족|기술제약|계약|보안|규정 …
#   근거    : provenance 2층(복수 가능) — 위치(역추적+버전핀) · 유형(구속력) · rev(인용 버전)
#             유형: RFP|과업지시서|회의록|제안서|법령|구두|내부
#   상태    : 합의|가정|미확정|위반위험
#   확인시점 : 마지막 확인한 revision 시점(YYYY-MM-DD). 신선도 계산 기준.
meta:
  갱신주기: 주간

전제: []
#  - id: PR-01
#    유형: 데이터범위
#    진술: "대상 데이터 범위 = …(국가·연도 등)"
#    근거:
#      - 위치: "revision/회의록/○○_회의록_YYYYMMDD.yml#안건:○○"
#        유형: 회의록        # RFP|과업지시서|회의록|제안서|법령|구두|내부
#        rev: "YYYY-MM-DD"
#    상태: 가정              # 합의|가정|미확정|위반위험
#    확인시점: "YYYY-MM-DD"
#    파급: ["흔들리면 영향받는 WBS·산출물·일정·원가"]
#    후속: "확정까지 할 일(→ risk/schedule)"
